<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNACH CORE | KUSANAGI-GEAR RGB</title>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #00ff41;
            --dark-bg: #050505;
        }

        * { 
            box-sizing: border-box; 
            /* Quitamos el cursor none en móviles para que se pueda usar */
        }

        @media (min-width: 1024px) {
            * { cursor: none !important; }
        }

        body {
            background-color: var(--dark-bg);
            color: var(--neon-green);
            font-family: 'Fira Code', monospace;
            margin: 0;
            padding: 10px;
            padding-bottom: 50px;
            overflow-x: hidden;
            width: 100%;
        }

        /* --- VIDEO DE FONDO --- */
        #bg-video {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            z-index: -2;
            filter: brightness(0.2) contrast(1.2);
            object-fit: cover;
        }

        .overlay-dark {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        /* CURSOR (Solo visible en PC) */
        #custom-cursor {
            display: none;
            width: 20px; height: 20px;
            border: 2px solid #fff;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            mix-blend-mode: difference;
            box-shadow: 0 0 10px #fff, 0 0 20px var(--neon-green);
        }
        @media (min-width: 1024px) { #custom-cursor { display: block; } }

        /* CONTENEDOR RGB RESPONSIVE */
        .rgb-container {
            position: relative;
            width: 100%;
            max-width: 850px;
            margin: 20px auto;
            padding: 2px;
            background: linear-gradient(90deg, #ff0000, #00ff00, #0000ff, #ff0000);
            background-size: 300% 300%;
            animation: rgbFlow 4s linear infinite;
            border-radius: 10px;
        }

        @keyframes rgbFlow {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        .inner-content {
            background: rgba(5, 5, 5, 0.9);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }

        /* GALERÍA DE FOTOS ADAPTADA */
        .photo-gallery {
            display: flex;
            flex-wrap: wrap; /* Para que se pongan una debajo de otra en cel pequeño */
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
        }

        .user-photo {
            width: 120px; /* Tamaño más cómodo para celular */
            height: 120px;
            border: 2px solid var(--neon-green);
            border-radius: 8px;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(0, 255, 65, 0.3);
        }

        .header-section h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            word-wrap: break-word;
        }

        /* BLOQUES DE PREGUNTAS ADAPTADOS */
        .question-block {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(0, 255, 65, 0.2);
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
        }

        .options label {
            display: flex;
            align-items: center;
            padding: 15px; /* Más grande para que sea fácil tocar con el dedo */
            border-radius: 5px;
            margin-bottom: 5px;
            background: rgba(0, 255, 65, 0.05);
        }

        .btn-submit {
            width: 100%;
            background: transparent;
            border: 2px solid var(--neon-green);
            color: var(--neon-green);
            padding: 20px;
            font-weight: bold;
            font-size: 1.2rem;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
        }

        /* RESULTADOS MÓVIL */
        #results {
            display: none;
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 10000;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

<video autoplay muted loop id="bg-video" playsinline>
    <source src="PinDown.io_@san1xx_1777925373.mp4" type="video/mp4">
</video>
<div class="overlay-dark"></div>

<div id="custom-cursor"></div>

<div class="rgb-container">
    <div class="inner-content">
        <div class="header-section" style="text-align: center;">
            <h1>UNACH_CORE_v3.0</h1>
            <p style="font-size: 0.8rem;">[ OWNER: PEPE | KUSANAGI_GEAR ]</p>
            
            <div class="photo-gallery">
                <!-- ASEGÚRATE QUE LOS NOMBRES SEAN IGUALES A TUS ARCHIVOS -->
                <img src="sepa la bola.jpg" alt="Dev 1" class="user-photo">
                <img src="__.jpg" alt="Dev 2" class="user-photo">
            </div>
            <hr style="border: 0; border-top: 1px solid #222;">
        </div>

        <div id="quiz-container"></div>

        <button class="btn-submit" onclick="processExam()">[ FINALIZAR EXAMEN ]</button>
    </div>
</div>

<div id="results">
    <h1 id="res-status">RESULTADO DEL PROTOCOLO</h1>
    <div id="res-score" style="font-size: 4rem; color: var(--neon-green);">00</div>
    <button onclick="location.reload()" style="background:none; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 15px 30px; margin-top: 20px;">REINICIAR SISTEMA</button>
</div>

<script>
const questions = [
    { q: "¿Cuál es el valor de x en: 5x - 10 = 40?", opt: ["8", "10", "12"], cor: 1, cat: "MATH" },
    { q: "Si un círculo tiene radio 3, su área aproximada es:", opt: ["28.27", "18.84", "9.42"], cor: 0, cat: "MATH" },
    { q: "Lenguaje para estructura de páginas web:", opt: ["Python", "HTML", "C++"], cor: 1, cat: "TECH" }
];

function init() {
    const container = document.getElementById('quiz-container');
    questions.forEach((item, i) => {
        const qDiv = document.createElement('div');
        qDiv.className = 'question-block';
        qDiv.innerHTML = `
            <div style="font-size: 0.6rem; color: #666; margin-bottom: 5px;">ID: UNCH-2026-${i} | ${item.cat}</div>
            <div style="font-weight: bold; margin-bottom: 15px; font-size: 0.9rem;">${i+1}. ${item.q}</div>
            <div class="options">
                ${item.opt.map((o, idx) => `
                    <label><input type="radio" name="q${i}" value="${idx}"><span style="margin-left:10px">${o}</span></label>
                `).join('')}
            </div>
        `;
        container.appendChild(qDiv);
    });
}

function processExam() {
    let score = 0;
    questions.forEach((q, i) => {
        const checked = document.querySelector(`input[name="q${i}"]:checked`);
        if(checked && parseInt(checked.value) === q.cor) score++;
    });
    document.getElementById('results').style.display = 'flex';
    document.getElementById('res-score').innerText = score + "/" + questions.length;
}

// Cursor solo para PC
if (window.innerWidth > 1024) {
    const cursor = document.getElementById('custom-cursor');
    document.addEventListener('mousemove', (e) => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
    });
}

init();
</script>

</body>
</html>
